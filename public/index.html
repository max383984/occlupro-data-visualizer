<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OccluPro Data Visualizer</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./movie.css" />
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9.4 4.7C6.1 6.1 4.3 9.9 5.2 13.4c.7 2.8 2.6 4.6 3.1 8.8.3 2.7 1.5 5.1 3.1 5.1 1.8 0 1.9-5.6 4.6-5.6s2.8 5.6 4.6 5.6c1.6 0 2.8-2.4 3.1-5.1.5-4.2 2.4-6 3.1-8.8.9-3.5-.9-7.3-4.2-8.7-3-1.3-4.8.7-6.6.7s-3.6-2-6.6-.7Z"/></svg></span><div><b>OccluPro</b><small>Electronic bite force meter</small></div></div>
      <div class="language-control"><span>🌐</span><select id="languageSelect" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ru">Русский</option><option value="ar">العربية</option><option value="ko">한국어</option></select></div>
    </header>

    <section class="hero">
      <p class="intro" data-i18n="intro">导入 OccluPro数据，即刻播放连续压力矩阵，并生成二维热力网格与交互式三维柱状图。</p>
      <div class="import-actions">
        <button id="importButton" disabled><span>＋</span> <b data-i18n="loadData">加载 OccluPro 数据</b></button>
      </div>
      <input id="fileInput" type="file" accept=".csv,text/csv" hidden />
    </section>

    <section class="meta">
      <div><span data-i18n="actualData">实际数据</span><strong id="fileName">—</strong></div>
      <div><span data-i18n="dataSize">数据规模</span><strong id="dimensions">44 × 52</strong></div>
      <div><span data-i18n="valueRange">数值范围</span><strong id="range">—</strong></div>
      <div><span data-i18n="frameCount">当前帧 / 总帧数</span><strong id="frameInfo">—</strong></div>
      <div><span data-i18n="frameAverage">当前帧平均值</span><strong id="average">—</strong></div>
    </section>

    <section class="keyframe-toolbar">
      <div class="jaw-switch" role="group" aria-label="牙颌显示模式">
        <button data-jaw="upper" class="active" data-i18n="upper" disabled>上颌</button>
        <button data-jaw="lower" data-i18n="lower" disabled>下颌</button>
        <button data-jaw="both" data-i18n="both" disabled>上下颌</button>
      </div>
      <span class="toolbar-separator"></span>
      <div class="keyframe-switch" role="group" aria-label="关键帧">
        <button data-keyframe="first" data-i18n="firstContact" disabled>首次接触</button>
        <button data-keyframe="maximum" data-i18n="maximumForce" disabled>最大咬合力</button>
        <button data-keyframe="contacts" data-i18n="maximumContacts" disabled>最大咬合交错</button>
      </div>
      <span class="toolbar-separator"></span>
      <button id="flipHorizontal" disabled>⇄ <span data-i18n="flip">左右翻转</span></button>
      <button id="toggleAnomaly" data-i18n="anomaly" disabled>异常值</button>
      <span class="toolbar-separator"></span>
      <button id="exportAnimation" data-i18n="exportAnimation" disabled>导出动画</button>
    </section>

    <section class="visuals">
      <article class="panel heat-panel">
        <div class="panel-title"><div><span>01</span><h2 data-i18n="twoD">二维</h2></div><div class="title-legend"><span>0</span><i></i><span>256</span></div></div>
        <div id="heatVisualization" class="heat-visualization upper">
          <div class="jaw-canvas upper-jaw"><canvas id="heatmap"></canvas></div>
          <div class="force-balance upper-balance">
          <div class="force-left"><span id="leftForceLabel">左侧受力</span><strong id="leftForcePercent">0.0%</strong></div>
          <div class="force-right"><span id="rightForceLabel">右侧受力</span><strong id="rightForcePercent">0.0%</strong></div>
          </div>
          <div class="force-balance lower-balance">
            <div class="force-left"><span class="left-force-label">左侧受力</span><strong class="left-force-percent">0.0%</strong></div>
            <div class="force-right"><span class="right-force-label">右侧受力</span><strong class="right-force-percent">0.0%</strong></div>
          </div>
          <div class="jaw-canvas lower-jaw"><canvas id="heatmapLower"></canvas></div>
        </div>
      </article>
      <article class="panel chart-panel">
        <div class="panel-title"><div><span>02</span><h2 data-i18n="threeD">三维</h2></div><small data-i18n="threeDHint">拖拽旋转 · 滚轮缩放</small></div>
        <div class="canvas-wrap"><canvas id="chart3d"></canvas></div>
        <div class="view-controls"><button data-view="iso" class="active" data-i18n="isometric">等轴</button><button data-view="top" data-i18n="topView">俯视</button><button data-view="front" data-i18n="frontView">正视</button><button id="resetView">↻ <span data-i18n="reset">重置</span></button></div>
      </article>
    </section>
    <section class="force-chart-panel">
      <div class="panel-title">
        <div><span>03</span><h2 data-i18n="force">力值</h2><button id="toggleForceChart" title="折叠力值曲线" aria-label="折叠力值曲线"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 12.5 10 7l5.5 5.5"/></svg></button></div>
        <div class="force-chart-actions"><div class="curve-legend"><span class="total-dot"></span><b data-i18n="total">总力</b><span class="left-dot"></span><b data-i18n="left">左侧</b><span class="right-dot"></span><b data-i18n="right">右侧</b></div></div>
      </div>
      <div class="force-chart-wrap"><canvas id="forceChart"></canvas></div>
    </section>
    <section id="timeline" class="timeline" hidden>
      <button id="firstFrame" title="第一帧">|‹</button>
      <button id="prevFrame" title="上一帧">‹</button>
      <button id="playButton" class="play" title="播放/暂停">▶</button>
      <button id="nextFrame" title="下一帧">›</button>
      <button id="lastFrame" title="最后一帧">›|</button>
      <input id="frameSlider" type="range" min="0" max="0" value="0" aria-label="播放进度" />
      <span id="timeInfo">00:00.000 / 00:00.000</span>
      <div class="timeline-force"><span data-i18n="force">力值</span><strong id="currentForcePercent">0.0%</strong></div>
    </section>
  </main>
  <div id="toast" role="alert"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
